include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "main"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "templates/kaniko.yaml"
      - "templates/harbor.yaml"
      - "jobs/semantic-release-env.yaml"
      - "jobs/container-build.yaml"
      - "jobs/lint-commit-messages.yaml"
      - "jobs/lint-pre-commit.yaml"
  - project: "univention/infrastructure/docker-services"
    ref: "master"
    file:
      - "dind.yml"
  - component: "$CI_SERVER_FQDN/univention/dev/nubus-for-k8s/common-ci/vul-man-single@v1.57.0"
    inputs:
      parallelism: 1
      container_image: "gitregistry.knut.univention.de/univention/dev/projects/ucs-base-image/ucs-base-525:latest"
      stage: "post-build"
      dep_track_tag: "ucs-base-image"

stages:
  - "prepare"
  - "build"
  - "post-build"
  - "test"
  - "trigger"
  - "package"
  - "publish"
  - "deploy"
  - "lint"

# when adding or removing UCS versions ensure they are updated in
#   variable UCS_VERSIONS
#   YAML anchors .build-ucs-versions-50, .build-ucs-versions-52,
#     .build-ucs-versions-53 and .ucs-versions
#   get_ucs_semver function
#   UCS_VERSIONS list in job test-ucs-base-usage-example

variables:
  EXTERNAL_REGISTRY: "docker.software-univention.de"
  DISTROLESS_BAZEL_IMAGE: "gcr.io/bazel-public/bazel:8.5.1"
  UCS_VERSIONS: "5010 525 526 530"
  UCS_VERSIONS_52: "525 526"
  UCS_VERSIONS_53: "530"
  TEST_DATE_BASED_TAGGING:
    description: >-
      Set to "true" in order to run the date based tagging job on a branch.
      Mainly intended to support testing the pipeline itself.
    value: "false"
    options:
      - "true"
      - "false"

# used for the container-build jobs
.build-ucs-versions-50: &ucs-versions-50
  - 5010

# used for the container-build jobs
.build-ucs-versions-52: &ucs-versions-52
  - 525
  - 526

# used for the container-build jobs
.build-ucs-versions-53: &ucs-versions-53
  - 530

.ucs-versions: &ucs-versions
  - 5010
  - 525
  - 526
  - 530

.post-build-matrix: &post-build-matrix
  - IMAGE_BASENAME:
      - "ucs-base"
    UCS_VERSION: *ucs-versions

find-latest-errata:
  stage: prepare
  script:
    - apt-get -qq update && apt-get -q install --assume-yes --no-install-recommends ca-certificates curl python3
    - sh docker/ucs-base/find-latest-errata.sh ${UCS_VERSIONS}
  artifacts:
    reports:
      dotenv: errata.env

container-build:
  # The GitLab runner mounts the Docker socket into /var/run.
  # Kaniko either ignores /var/run (default), or the socket ends up in the tarball.
  # We unmount the socket here, and later use `--ignore-var-run=false` to have a
  # regular /var/run directory in the final image.
  before_script:
    - "umount /var/run/docker.sock"
    - "rm -rf /var/run"
  parallel:
    matrix:
      - IMAGE_BASENAME: "ucs-base"
        UCS_VERSION: *ucs-versions-50
        APT_REPOSITORY: "http://updates.software-univention.de/"
        TARGET: "final-with-packages"

      - IMAGE_BASENAME: "ucs-base"
        UCS_VERSION: *ucs-versions-52
        APT_REPOSITORY: "http://updates.software-univention.de/"
        TARGET: "final-with-packages"
        DOCKERFILE_PATH: "usr-merge.Dockerfile"

      # 5.3 is not yet released; build against the test mirror.
      - IMAGE_BASENAME: "ucs-base"
        UCS_VERSION: *ucs-versions-53
        APT_REPOSITORY: "https://updates-test.software-univention.de/"
        TARGET: "final-with-packages"
        DOCKERFILE_PATH: "usr-merge.Dockerfile"

      - IMAGE_BASENAME: "ucs-base-python"
        UCS_VERSION: *ucs-versions-52
        APT_REPOSITORY: "http://updates.software-univention.de/"
        TARGET: "final-with-packages-and-python"
        DOCKERFILE_PATH: "usr-merge.Dockerfile"

      - IMAGE_BASENAME: "ucs-base-python"
        UCS_VERSION: *ucs-versions-53
        APT_REPOSITORY: "https://updates-test.software-univention.de/"
        TARGET: "final-with-packages-and-python"
        DOCKERFILE_PATH: "usr-merge.Dockerfile"

      - IMAGE_BASENAME: "ucs-base-dev"
        UCS_VERSION: *ucs-versions-50
        APT_REPOSITORY: "http://updates.software-univention.de/"
        TARGET: "dev"

      - IMAGE_BASENAME: "ucs-base-dev"
        UCS_VERSION: *ucs-versions-52
        APT_REPOSITORY: "http://updates.software-univention.de/"
        TARGET: "dev"
        DOCKERFILE_PATH: "usr-merge.Dockerfile"

      - IMAGE_BASENAME: "ucs-base-dev"
        UCS_VERSION: *ucs-versions-53
        APT_REPOSITORY: "https://updates-test.software-univention.de/"
        TARGET: "dev"
        DOCKERFILE_PATH: "usr-merge.Dockerfile"

      - IMAGE_BASENAME: "ucs-base-flex"
        UCS_VERSION: *ucs-versions-50
        APT_REPOSITORY: "http://updates.software-univention.de/"
        TARGET: "final"
        DOCKERFILE_PATH: "Dockerfile"

      - IMAGE_BASENAME: "ucs-base-flex"
        UCS_VERSION: *ucs-versions-52
        APT_REPOSITORY: "http://updates.software-univention.de/"
        TARGET: "final"
        DOCKERFILE_PATH: "usr-merge.Dockerfile"

      - IMAGE_BASENAME: "ucs-base-flex"
        UCS_VERSION: *ucs-versions-53
        APT_REPOSITORY: "https://updates-test.software-univention.de/"
        TARGET: "final"
        DOCKERFILE_PATH: "usr-merge.Dockerfile"
  variables:
    KANIKO_BUILD_CONTEXT: "docker/ucs-base"
    IMAGE_NAME: "${IMAGE_BASENAME}-${UCS_VERSION}"
    KANIKO_ARGS: --ignore-var-run=false
      --cache=false
      --build-arg UCS_VERSION=${UCS_VERSION}
      --build-arg APT_REPOSITORY=${APT_REPOSITORY}
      --build-arg ERRATA_LEVEL=${ERRATA_LEVEL_${UCS_VERSION}}
      --target ${TARGET}

sbon-scan-and-upload-single-image:
  needs:
    - container-build
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: never
    - when: always

container-add-date-based-tags:
  stage: post-build
  extends: .skopeo
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: "$CI_MERGE_REQUEST_DESCRIPTION =~ /force-date-based-tags/"
    - if: $TEST_DATE_BASED_TAGGING == "true"
  variables:
    GIT_STRATEGY: none
  script:
    - |
      get_ucs_semver() {
        local ucs_version=$1
        if [ "$ucs_version" = "5010" ]; then
          echo "5.0.10"
        elif [ "$ucs_version" = "525" ]; then
          echo "5.2.5"
        elif [ "$ucs_version" = "526" ]; then
          echo "5.2.6"
        elif [ "$ucs_version" = "530" ]; then
          echo "5.3.0"
        else
          echo "$ucs_version" # Fallback for unknown versions
        fi
      }

      tag_image() {
        local image_prefix=$1
        local ucs_version=$2
        local ucs_semver=$(get_ucs_semver "$ucs_version")
        local build_date=$(date +%Y%m%d)
        local source_image="$CI_REGISTRY_IMAGE/${image_prefix}-${ucs_version}:$RELEASE_VERSION"
        local target_image="$CI_REGISTRY_IMAGE/${image_prefix}:${ucs_semver}-build.${build_date}"
        echo "Tagging image"
        echo "  from: $source_image"
        echo "    to: $target_image"
        /bin/skopeo copy docker://$source_image docker://$target_image
      }

      tag_image_flex() {
        local image_prefix=$1
        local ucs_version=$2
        local ucs_semver=$(get_ucs_semver "$ucs_version")
        local source_image="$CI_REGISTRY_IMAGE/${image_prefix}-${ucs_version}:$RELEASE_VERSION"
        local target_image="$CI_REGISTRY_IMAGE/${image_prefix}:${ucs_semver}"
        echo "Tagging flex image"
        echo "  from: $source_image"
        echo "    to: $target_image"
        /bin/skopeo copy docker://$source_image docker://$target_image
      }

      for ucs_version in $UCS_VERSIONS; do
        tag_image "ucs-base" "$ucs_version"
        tag_image_flex "ucs-base-flex" "$ucs_version"
      done

      for ucs_version in $UCS_VERSIONS_52 $UCS_VERSIONS_53; do
        tag_image "ucs-base-python" "$ucs_version"
      done

      for ucs_version in $UCS_VERSIONS_53; do
        tag_image "ucs-distroless-python" "$ucs_version"
        tag_image "ucs-distroless-python-ldap" "$ucs_version"
        tag_image "ucs-distroless-python-shell" "$ucs_version"
      done


test-ucs-base-usage-example:
  stage: "test"
  extends: ".kaniko"
  cache: null
  parallel:
    matrix:
      - IMAGE_BASENAME: "ucs-base"
        DOCKERFILE_PATH: "Dockerfile.usage-example"
        UCS_VERSION: *ucs-versions
      # TODO: re-add 530 once the build2/git dev repo is re-signed with a
      # modern key. UCS 5.3 is trixie-based and its apt (Sequoia/sqv) rejects
      # the DSA-2048 signing key on http://omar.knut.univention.de/build2/git,
      # which breaks dev.Dockerfile.usage-example (ucs-dev-add-branch.sh).
      # 5.0/5.2 (bookworm) still accept the key, so they stay enabled.
      - IMAGE_BASENAME: "ucs-base-dev"
        DOCKERFILE_PATH: "dev.Dockerfile.usage-example"
        UCS_VERSION:
          - 5010
          - 525
          - 526
  variables:
    KANIKO_BUILD_CONTEXT: "docker/ucs-base"
    IMAGE_NAME: "${IMAGE_BASENAME}-${UCS_VERSION}"
    CI_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/${IMAGE_BASENAME}-${UCS_VERSION}-usage-example"
    KANIKO_CACHE_ARGS: ""
    KANIKO_ARGS: --no-push
      --build-arg UCS_BASE_IMAGE_TAG=${RELEASE_VERSION}
      --build-arg UCS_VERSION=${UCS_VERSION}

mirror-release:
  stage: "publish"
  image: "${RUNNER_REGISTRY_IMAGE}:${RUNNER_IMAGE_TAG}"
  needs:
    - container-build
    - pre-semantic-release
  variables:
    RUNNER_REGISTRY_IMAGE: "gitregistry.knut.univention.de/univention/infrastructure/ci-images/gitlab-utils/gitlab-utils"
    RUNNER_IMAGE_TAG: "latest"
  parallel:
    matrix:
      - UCS_VERSION: *ucs-versions
  script:
    - |
      set -eu
      # check if RELEASE_VERSION is a release version, not a pre-release version
      MATCH="^[0-9]+\.[0-9]+\.[0-9]+$";
      if [[ "${RELEASE_VERSION}" =~ ${MATCH} ]]; then
        echo "Release version '${RELEASE_VERSION}' detected, mirroring '$CI_REGISTRY_IMAGE/ucs-base-$UCS_VERSION:$RELEASE_VERSION' to '$PUBLIC_DOCKER_REGISTRY/ucs-base-$UCS_VERSION:$RELEASE_VERSION'"
      else
        echo "No valid release version detected (RELEASE_VERSION is '${RELEASE_VERSION}'), skipping mirroring"
        exit 0
      fi
      chmod 0400 "${DOCKER_PROXY_MACHINE_SSH_KEY}"
      export SSH_CMD="ssh -i ${DOCKER_PROXY_MACHINE_SSH_KEY} -o UserKnownHostsFile=\"${DOCKER_PROXY_MACHINE_SSH_PUBLIC_KEY}\""
      ${SSH_CMD} "${DOCKER_PROXY_USER}"@"${DOCKER_PROXY_MACHINE}" sudo /usr/bin/docker \
        pull \
        "${CI_REGISTRY_IMAGE}/ucs-base-${UCS_VERSION}:${RELEASE_VERSION}"
      ${SSH_CMD} "${DOCKER_PROXY_USER}"@"${DOCKER_PROXY_MACHINE}" sudo /usr/bin/docker \
        tag \
        "${CI_REGISTRY_IMAGE}/ucs-base-${UCS_VERSION}:${RELEASE_VERSION}" \
        "${PUBLIC_DOCKER_REGISTRY}/ucs-base-${UCS_VERSION}:${RELEASE_VERSION}"
      ${SSH_CMD} "${DOCKER_PROXY_USER}"@"${DOCKER_PROXY_MACHINE}" sudo /usr/bin/docker \
        push \
        "${PUBLIC_DOCKER_REGISTRY}/ucs-base-${UCS_VERSION}:${RELEASE_VERSION}"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

# Unlike the debootstrap images above, these are built by Bazel: no kaniko, no
# Docker daemon, no privileged runner. See distroless/README.md.
.distroless-python:
  image:
    name: "${DISTROLESS_BAZEL_IMAGE}"
    entrypoint: [""]
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - changes:
        - "distroless/**/*"
  cache:
    key: "distroless-python-bazel"
    paths:
      - ".bazel-cache"
  before_script:
    - "cd distroless"
    - "echo 'build --disk_cache=../.bazel-cache' >> .bazelrc"

distroless-python-build:
  extends: ".distroless-python"
  stage: "build"
  script:
    - "bazel build //:ucs530_tarball //:ucs530_ldap_tarball //:ucs530_shell_tarball --output_groups=+tarball"
    # bazel-bin is a symlink into the output base; copy out so the artifact is real
    - "mkdir -p ../tarballs"
    - "cp bazel-bin/ucs530_tarball/tarball.tar ../tarballs/ucs-distroless-python-530.tar"
    - "cp bazel-bin/ucs530_ldap_tarball/tarball.tar ../tarballs/ucs-distroless-python-ldap-530.tar"
    - "cp bazel-bin/ucs530_shell_tarball/tarball.tar ../tarballs/ucs-distroless-python-shell-530.tar"
  artifacts:
    paths:
      - "tarballs/"
    expire_in: "1 day"

distroless-python-push:
  extends: ".skopeo"
  stage: "build"
  needs:
    - "distroless-python-build"
    - "pre-semantic-release"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - changes:
        - "distroless/**/*"
  variables:
    GIT_STRATEGY: "none"
  script:
    - |
      for variant in "" "-ldap" "-shell"; do
        image="ucs-distroless-python${variant}-530"
        echo "pushing ${image}:${RELEASE_VERSION}"
        /bin/skopeo copy \
          "docker-archive:tarballs/${image}.tar" \
          "docker://${CI_REGISTRY_IMAGE}/${image}:${RELEASE_VERSION}"
      done

# Builds a derived image the way a service would and runs it, so a package
# dropped from a manifest fails here rather than in a consuming project.
distroless-python-smoke-test:
  extends: ".dind"
  stage: "test"
  image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:24.0.7"
  needs:
    - "distroless-python-build"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - changes:
        - "distroless/**/*"
  before_script:
    # let the client negotiate the API version with the daemon
    - "unset DOCKER_API_VERSION"
    - "docker version"
  script:
    - |
      set -eu
      for variant in "" "-ldap" "-shell"; do
        image="ucs-distroless-python${variant}-530"
        echo "smoke testing ${image}"
        tag="$(docker load -i "tarballs/${image}.tar" | sed -n 's/^Loaded image: //p')"
        # every tarball carries the same tag and the daemon is shared with other
        # jobs, so pin a unique tag to the ID this job just loaded
        base="smoke-base-${CI_JOB_ID}${variant}"
        docker tag "$(docker image inspect --format '{{.Id}}' "$tag")" "$base"
        docker build --build-arg "BASE_IMAGE=${base}" \
          -t "smoke-${CI_JOB_ID}${variant}" -f distroless/tests/Dockerfile.smoke distroless/tests
        docker run --rm "smoke-${CI_JOB_ID}${variant}"
      done
  after_script:
    - "docker rmi -f $(docker images -q 'smoke-*') || true"

distroless-python-drift-check:
  extends: ".distroless-python"
  stage: "test"
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'schedule'"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - changes:
        - "distroless/**/*"
  script:
    - "./tools/check-drift.sh"

...
